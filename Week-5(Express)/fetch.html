            // what if you have to access and print multiple posts 
            async function fun(){
                const response = await axios.get("https://jsonplaceholder.typicode.com/posts");
                // then we know that response will have store multiple posts , store them into a array 
                const arr = response.data;
                // now traverse arr to get all posts 
                for(let i =0; i<arr.length; i++){
                    //document.getElementById("posts").innerHTML += "<div>" + JSON.stringify(arr[i]) + "</div>";
                    document.getElementById("posts").innerHTML += "<div>" + (arr[i].title) + "</div>";
                }
            }
