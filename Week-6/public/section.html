<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two Sections Example</title>
  <style>
    /* basic styling to visually separate the two sections */
    .section-one {
      background-color: #f0f4f8;
      padding: 40px 20px;
    }

    .section-two {
      background-color: #ffffff;
      padding: 40px 20px;
      border-top: 2px solid #e0e0e0;
    }
  </style>
</head>
<body>

  <!-- Section 1 -->
  <section class="section-one">
    <h2>Section 1: Hero Header</h2>
    <p>This is the first section of your page. It can hold intro text, images, or call-to-action buttons.</p>
  </section>

  <!-- Section 2 -->
  <section class="section-two">
    <h2>Section 2: Details & Services</h2>
    <p>This is the second section of your page. You can use it for features, articles, or contact info.</p>
  </section>
  

</body>
</html>
